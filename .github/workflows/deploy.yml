name: Despliegue

on:
    push:
        branches: [ "main" ]

jobs:
    deploy:
        runs-on: ubuntu-latest
    
        steps:

        -   name: Montar web
            uses: actions/checkout@v4
        
        -   name: Login en docker hub
            uses: docker/login-action@v3
            with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

        -   name: Contruir backend
            uses: docker/build-push-action@v5
            with:
                context: .
                push: true
                file: ./backend/Dockerfile
                tags: ${{ secrets.DOCKER_USERNAME}}/app-web-backend:latest

        -   name: Construir frontend
            uses: docker/build-push-action@v5
            with:
                context: ./mi-proyecto
                push: true
                file: ./mi-proyecto/Dockerfile
                tags: ${{ secrets.DOCKER_USERNAME }}/app-web-frontend:latest

        -   name: Entrar y desplegar en VPS
            uses: appleboy/ssh-action@master
            with:
                host: ${{ secrets.VPS_HOST }}
                username: ${{ secrets.VPS_USERNAME }}
                key: ${{ secrets.VPS_PASSWORD }}

                script: |
                    cd ~/poryect_app
                    git pull origin main
                    docker compose pull
                    docker compose up -d --build
                    docker image prune -f